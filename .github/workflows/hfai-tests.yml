name: HFAI contract tests
on:
  push:
    branches: [main]
    paths:
      - 'schema/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'capability-registry/**'
      - 'docs/**'
      - '.github/workflows/hfai-tests.yml'
  pull_request:
    paths:
      - 'schema/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - '.github/workflows/hfai-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example envelope
        run: python tools/validate_handoff.py examples/handoff.example.json
      - name: Validate capability registry JSON files
        run: python -c "import json,pathlib; files=list(pathlib.Path('capability-registry').glob('*.json')); assert files, 'no registry JSON files found'; [json.loads(p.read_text(encoding='utf-8')) for p in files]; print(f'Validated {len(files)} capability registry JSON file(s)')"
